name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    name: Zig — test + smoke + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig build test
        run: zig build test --summary all
      - name: zig build wasm
        run: zig build wasm
      - name: Confirm dreamball.wasm ≤ 300 KB raw, ≤ 150 KB gzipped
        # gzipped (the over-the-wire cost) is the binding constraint.
        # raw relaxed 200→224 KB on 2026-06-25 (nested-envelope decoders).
        # 2026-06-28: relaxed to 300 KB raw / 150 KB gzip — a deliberate
        # dev-velocity budget with generous headroom. verifyAction (sprint-003 B2)
        # is the first WASM caller of envelope_v2.decodeAction, linking the full
        # v3/v4 decode path (~2 KB gzip) and pushing the binary past the old
        # 64 KB ceiling. The optimization pass to restore a tight gzip budget is
        # tracked in Dreamball-8bk.
        # See ADR 2026-06-28-wasm-size-budget-dev-velocity-bump.
        run: |
          raw=$(wc -c < src/lib/wasm/dreamball.wasm)
          gz=$(gzip -9c src/lib/wasm/dreamball.wasm | wc -c)
          echo "dreamball.wasm is ${raw} bytes raw, ${gz} bytes gzipped"
          test "$raw" -le 307200
          test "$gz" -le 153600
      - name: Vendor bundle consistency (no drift from committed wasm)
        # The depend-able release/dreamball-wasm/ bundle must stay in lockstep
        # with the committed source binary. Platform-independent: we compare
        # the COMMITTED src wasm (not the just-rebuilt one) so this does not
        # rely on cross-host build reproducibility. If it fails, run
        # scripts/build-vendor-wasm.sh and commit release/dreamball-wasm/.
        run: |
          # 1) checksum file is valid for the vendored binary
          (cd release/dreamball-wasm && sha256sum -c dreamball.wasm.sha256)
          # 2) vendored binary == the committed source binary
          git cat-file blob HEAD:src/lib/wasm/dreamball.wasm > /tmp/committed-src.wasm
          cmp /tmp/committed-src.wasm release/dreamball-wasm/dreamball.wasm
      - name: zig build smoke
        run: zig build smoke
      - name: wasm-spike (Story 5.1 — AC3 linux parity, AC6 perf publish)
        # Runs the same `zig build wasm-spike-host` invocation as the
        # darwin developer baseline. Per Story 5.1 AC3, the same Zig
        # source must produce identical guest output on linux without
        # per-platform divergence. AC6 publishes the measured cold
        # instantiation time; if it exceeds NFR4's 100 ms budget the
        # spike exits non-zero (no silent budget relaxation).
        run: |
          out=$(zig build wasm-spike-host 2>&1)
          echo "$out"
          echo "$out" | grep -q 'spike: hello.wasm wrote: HELLO_FROM_DREAMBALL_SPIKE'
          echo "$out" | grep -q 'spike: hello-bad.wasm rejected import env.malicious_function'
          echo "$out" | grep -q 'spike: all ACs (2,4,5,6) green'
      - name: Upload dreamball.wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamball.wasm
          path: src/lib/wasm/dreamball.wasm
          if-no-files-found: error

  bun:
    name: Bun — check + tests + build
    runs-on: ubuntu-latest
    needs: zig
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Rebuild WASM (deterministic)
        run: zig build wasm
      - name: bun run check
        run: bun run check
      # Node-only leg: fast, no browser. Kept separate from the browser leg so a
      # missing/broken chromium is distinguishable from a genuine logic failure
      # (a fused `test:unit` silently dropped 36 files when chromium was absent).
      - name: bun run test:unit (node leg)
        run: bun run test:unit -- --run
      # Use the repo-pinned binary, NOT `bunx playwright` — bunx resolves a newer
      # playwright from the registry and installs a chromium build number that the
      # pinned playwright-core never looks for (observed: bunx fetched 1228 while
      # playwright-core@1.59.1 wants 1217, so the browser stayed "missing").
      - name: Install chromium for browser-mode vitest
        run: ./node_modules/.bin/playwright install --with-deps chromium
      # Browser leg: `client` (svelte component + wasm cross-runtime tests) and
      # `storybook`. These need a real DOM — see vite.config.ts projects.
      - name: bun run test:browser (browser leg)
        run: bun run test:browser -- --run
      - name: bun run build
        run: bun run build
      - name: bun run build-storybook
        run: bun run build-storybook
      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          if-no-files-found: error

  grep-no-todo-crypto-leak:
    name: Guard — no leaked secret-key fields on read routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm secret_key_b58 is only in the mint response
        run: |
          # Whitelist: the mint route is the ONLY place secret_key_b58 is
          # legitimately RETURNED. The rest of dreamball-server/src/ references it
          # safely — write routes (grow/join-guild) read it from the REQUEST body;
          # read/strip routes (show/list/transmit/unlock-relic) explicitly delete it
          # from responses; mcp-doc.ts documents the request/response shapes;
          # index.test.ts asserts mint returns it. This static grep cannot tell a
          # strip from a leak, so the whole server tree is allowlisted here and the
          # real no-leak protection moves to a runtime test (Dreamball-a8u: assert
          # show/list HTTP responses omit secret_key_b58). See that bead.
          allowed='dreamball-server/src/\|src/wasm_main.zig\|src/lib/wasm/write-ops.test.ts\|src/cli\|README.md\|docs/\|.omc/plans/\|CLAUDE.md\|tools/schema-gen'
          hits=$(grep -rn 'secret_key_b58' --include='*.ts' --include='*.zig' --include='*.svelte' . \
                 | grep -v "$allowed" || true)
          if [ -n "$hits" ]; then
            echo "Leak candidates:"
            echo "$hits"
            exit 1
          fi

  deploy-storybook:
    name: Deploy Storybook to GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: bun
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - name: Deploy
        id: pages
        uses: actions/deploy-pages@v4
