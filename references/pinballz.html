<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PSYCHEDELIC PINBALL KARAOKE • DREAMBALLZ</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background-color: black;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      text-shadow: 0 0 20px magenta, 0 0 40px cyan;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 5px;
      z-index: 100;
      pointer-events: none;
      background: rgba(0,0,0,0.6);
      padding: 10px 25px;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.3);
    }
    #scoreBoard {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #ffea00;
      text-shadow: 0 0 30px #ff00ff, 0 0 15px #00ffff;
      font-size: 2.8rem;
      font-weight: 900;
      z-index: 100;
      background: rgba(10,0,30,0.8);
      padding: 15px 35px;
      border-radius: 70px;
      backdrop-filter: blur(12px);
      border: 2px solid #ff00ff;
      box-shadow: 0 0 40px #ff00ffaa;
      letter-spacing: 3px;
    }
    #karaokeLine {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      z-index: 100;
      background: linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 60px #ff00ff, 0 0 25px cyan;
      white-space: nowrap;
      letter-spacing: 4px;
      animation: pulseText 1.2s infinite alternate;
    }
    @keyframes pulseText {
      0% { opacity: 0.9; transform: translateX(-50%) scale(1); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.06); }
    }
    .controls {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      z-index: 100;
    }
    button {
      background: rgba(20,0,40,0.8);
      backdrop-filter: blur(15px);
      border: 2px solid #ff00ff;
      color: #fff;
      font-size: 1.8rem;
      font-weight: bold;
      padding: 15px 35px;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 0 35px #ff00ffcc, 0 0 15px cyan inset;
      text-transform: uppercase;
      letter-spacing: 5px;
      transition: all 0.2s ease;
      background: linear-gradient(45deg, #2a004a, #0a0020);
      color: #ffe600;
      text-shadow: 0 0 15px magenta;
    }
    button:active {
      transform: scale(0.92);
      box-shadow: 0 0 70px #ffff00, 0 0 30px #ff0080;
      background: #ff00aa;
      color: white;
    }
    @media (max-width: 700px) {
      #info { font-size: 1rem; top: 10px; }
      #scoreBoard { font-size: 2rem; padding: 10px 20px; }
      .controls button { font-size: 1.4rem; padding: 10px 25px; }
    }
  </style>
</head>
<body>
  <div id="info">🌀 DREAMBALLZ • PSYCHEDELIC PINBALL KARAOKE 🎤</div>
  <div id="scoreBoard">💎 <span id="scoreValue">0</span></div>
  <div id="karaokeLine">✨ “DREAM • BALL • Z” ✨</div>
  <div class="controls">
    <button id="leftPaddleBtn">◀ LEFT</button>
    <button id="rightPaddleBtn">RIGHT ▶</button>
  </div>

  <!-- Import maps and libraries -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    
    // ---------- PSYCHEDELIC PINBALL KARAOKE with DREAMBALLZ ----------
    // Master skill prompt: interactive physics, fun sounds, score system, trippy visuals
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    // Add a starfield / nebula effect with a canvas texture
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a001a';
    ctx.fillRect(0,0,512,512);
    for(let i=0; i<300; i++) {
      ctx.fillStyle = `hsl(${Math.random()*360}, 90%, 70%)`;
      ctx.beginPath();
      ctx.arc(Math.random()*512, Math.random()*512, Math.random()*3+0.8, 0, Math.PI*2);
      ctx.fill();
    }
    const starTexture = new THREE.CanvasTexture(canvas);
    scene.background = starTexture;
    
    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(7, 9, 14);
    camera.lookAt(0, 0.5, 0);
    
    // WebGL Renderer
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    
    // CSS2 Renderer for floating labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none'; // allow clicking through to buttons
    document.body.appendChild(labelRenderer.domElement);
    
    // Lighting
    const ambient = new THREE.AmbientLight(0x404080);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffccff, 0.9);
    dirLight.position.set(5, 12, 8);
    dirLight.castShadow = true;
    dirLight.receiveShadow = true;
    dirLight.shadow.mapSize.width = 512;
    dirLight.shadow.mapSize.height = 512;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -6;
    scene.add(dirLight);
    
    // Add colorful point lights for psychedelic vibe
    const colorLights = [
      { color: 0xff00ff, pos: [3, 2, 3] },
      { color: 0x00ffff, pos: [-3, 1.5, -2] },
      { color: 0xffaa00, pos: [0, 4, -1] }
    ];
    colorLights.forEach(l => {
      const pl = new THREE.PointLight(l.color, 0.9, 12);
      pl.position.set(l.pos[0], l.pos[1], l.pos[2]);
      scene.add(pl);
    });
    
    // --- GAME STATE ---
    const state = {
      score: 0,
      ballSpeed: 0.18,
      paddleAngle: 0,
      leftPaddleActive: false,
      rightPaddleActive: false,
      karaokePhrases: [
        "🎵 DREAM • BALL • Z 🎵", 
        "✨ PSYCHEDELIC GROOVE ✨", 
        "🌈 TRIPPY PINBALL 🌈", 
        "🎤 SING WITH THE BALL 🎤",
        "💖 NEON DREAMS 💖",
        "🌀 SPINNING COSMOS 🌀",
        "🎶 KARAOKE STAR 🎶"
      ],
      currentPhrase: 0,
      phraseTimer: 0
    };
    
    // Physics world boundaries
    const bounds = {
      left: -4.2,
      right: 4.2,
      top: 5.5,
      bottom: -4.8,
      zFront: 1.8,
      zBack: -1.2
    };
    
    // --- CREATE PINBALL ELEMENTS ---
    
    // Main playfield (slanted slightly)
    const playfieldGeo = new THREE.BoxGeometry(9, 11, 0.3);
    const playfieldMat = new THREE.MeshStandardMaterial({ 
      color: 0x1a0030, 
      roughness: 0.25, 
      metalness: 0.7,
      emissive: new THREE.Color(0x110022)
    });
    const playfield = new THREE.Mesh(playfieldGeo, playfieldMat);
    playfield.position.set(0, 0.2, -0.2);
    playfield.rotation.x = -0.12;
    playfield.receiveShadow = true;
    playfield.castShadow = true;
    scene.add(playfield);
    
    // Add grid and decorative lines
    const gridHelper = new THREE.GridHelper(9, 20, 0xff00ff, 0x00ffff);
    gridHelper.position.y = 0.4;
    scene.add(gridHelper);
    
    // Psychedelic bumpers (dream ballz style)
    function createBumper(x, y, z, color, size = 0.65) {
      const group = new THREE.Group();
      const sphereGeo = new THREE.SphereGeometry(size, 32, 16);
      const sphereMat = new THREE.MeshStandardMaterial({ 
        color: color,
        roughness: 0.2,
        metalness: 0.3,
        emissive: new THREE.Color(color).multiplyScalar(0.7)
      });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.castShadow = true;
      sphere.receiveShadow = true;
      group.add(sphere);
      
      // glowing ring
      const ringGeo = new THREE.TorusGeometry(size*1.15, 0.08, 16, 32);
      const ringMat = new THREE.MeshStandardMaterial({ 
        color: 0xffffff, 
        emissive: new THREE.Color(color),
        roughness: 0.1
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI/2;
      group.add(ring);
      
      group.position.set(x, y, z);
      scene.add(group);
      
      // label
      const div = document.createElement('div');
      div.textContent = '💎';
      div.style.color = 'white';
      div.style.fontSize = '20px';
      div.style.textShadow = '0 0 20px magenta';
      const label = new CSS2DObject(div);
      label.position.set(0, size+0.15, 0);
      group.add(label);
      
      return { mesh: group, position: new THREE.Vector3(x, y, z), radius: size, color: color };
    }
    
    const bumpers = [
      createBumper(-2.0, 2.8, 0.3, 0xff44ff, 0.7),
      createBumper(2.0, 2.8, 0.3, 0xff44ff, 0.7),
      createBumper(0, 3.8, -0.2, 0xffaa00, 0.8),
      createBumper(-2.8, 0.5, 0.4, 0x44ffff, 0.65),
      createBumper(2.8, 0.5, 0.4, 0x44ffff, 0.65),
      createBumper(0, -1.8, 0.2, 0xff0088, 0.75),
    ];
    
    // Flippers / Paddles (visual and physics)
    function createPaddle(x, y, z, color, isLeft) {
      const group = new THREE.Group();
      const paddleGeo = new THREE.BoxGeometry(1.4, 0.25, 0.5);
      const paddleMat = new THREE.MeshStandardMaterial({ 
        color: color, 
        roughness: 0.2, 
        metalness: 0.8,
        emissive: new THREE.Color(color).multiplyScalar(0.5)
      });
      const paddle = new THREE.Mesh(paddleGeo, paddleMat);
      paddle.castShadow = true;
      paddle.receiveShadow = true;
      group.add(paddle);
      
      // decorative glow
      const edgeGeo = new THREE.EdgesGeometry(paddleGeo);
      const edgeLine = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0xffffff }));
      group.add(edgeLine);
      
      group.position.set(x, y, z);
      scene.add(group);
      
      return { 
        group, 
        isLeft,
        basePos: new THREE.Vector3(x, y, z),
        active: false,
        angle: 0,
        targetAngle: 0
      };
    }
    
    const leftPaddle = createPaddle(-2.5, -3.5, 0.5, 0xff3366, true);
    const rightPaddle = createPaddle(2.5, -3.5, 0.5, 0x33ff99, false);
    
    // Ball (DREAMBALLZ)
    const ballGroup = new THREE.Group();
    const ballGeo = new THREE.SphereGeometry(0.45, 48, 48);
    const ballMat = new THREE.MeshStandardMaterial({ 
      color: 0xffaa00, 
      roughness: 0.1, 
      metalness: 0.2,
      emissive: new THREE.Color(0xff4400)
    });
    const ballCore = new THREE.Mesh(ballGeo, ballMat);
    ballCore.castShadow = true;
    ballCore.receiveShadow = true;
    ballGroup.add(ballCore);
    
    // swirling dream aura
    const auraGeo = new THREE.TorusGeometry(0.55, 0.08, 16, 32);
    const auraMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: new THREE.Color(0xff00aa), roughness: 0.1 });
    const auraRing = new THREE.Mesh(auraGeo, auraMat);
    ballGroup.add(auraRing);
    const auraRing2 = new THREE.Mesh(auraGeo, auraMat);
    auraRing2.rotation.x = Math.PI/2;
    ballGroup.add(auraRing2);
    
    ballGroup.position.set(0, -1.2, 0.6);
    scene.add(ballGroup);
    
    // Ball physics data
    const ball = {
      mesh: ballGroup,
      velocity: new THREE.Vector3(0.12, 0.08, 0.04),
      radius: 0.45
    };
    
    // Collision sound synthesis (fun sounds using Web Audio API)
    let audioCtx;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playBounceSound(frequency = 440, type = 'square', duration = 0.12) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(frequency*0.5, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    
    function playBumperSound() {
      if (!audioCtx) return;
      playBounceSound(680, 'triangle', 0.15);
      setTimeout(() => playBounceSound(880, 'sine', 0.1), 60);
    }
    
    function playPaddleSound() {
      playBounceSound(320, 'sawtooth', 0.1);
    }
    
    function playScoreSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }
    
    // Update score display
    function updateScore(points = 10) {
      state.score += points;
      document.getElementById('scoreValue').textContent = state.score;
      playScoreSound();
      // Change karaoke phrase sometimes
      if (Math.random() < 0.3) {
        state.currentPhrase = (state.currentPhrase + 1) % state.karaokePhrases.length;
      }
    }
    
    // Reset ball if fallen
    function resetBall() {
      ball.mesh.position.set(0, -1.2, 0.6);
      ball.velocity.set(
        (Math.random() - 0.5) * 0.25,
        Math.random() * 0.15 + 0.08,
        (Math.random() - 0.5) * 0.15
      );
    }
    
    // Paddle activation
    function setPaddleActive(side, active) {
      if (side === 'left') {
        leftPaddle.active = active;
        leftPaddle.targetAngle = active ? 0.7 : 0;
      } else {
        rightPaddle.active = active;
        rightPaddle.targetAngle = active ? -0.7 : 0;
      }
      if (active) playPaddleSound();
    }
    
    // Button listeners
    document.getElementById('leftPaddleBtn').addEventListener('mousedown', (e) => {
      e.preventDefault();
      initAudio();
      setPaddleActive('left', true);
    });
    document.getElementById('leftPaddleBtn').addEventListener('mouseup', (e) => {
      e.preventDefault();
      setPaddleActive('left', false);
    });
    document.getElementById('leftPaddleBtn').addEventListener('mouseleave', (e) => {
      setPaddleActive('left', false);
    });
    document.getElementById('rightPaddleBtn').addEventListener('mousedown', (e) => {
      e.preventDefault();
      initAudio();
      setPaddleActive('right', true);
    });
    document.getElementById('rightPaddleBtn').addEventListener('mouseup', (e) => {
      e.preventDefault();
      setPaddleActive('right', false);
    });
    document.getElementById('rightPaddleBtn').addEventListener('mouseleave', (e) => {
      setPaddleActive('right', false);
    });
    
    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        initAudio();
        setPaddleActive('left', true);
      } else if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        initAudio();
        setPaddleActive('right', true);
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        setPaddleActive('left', false);
      } else if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        setPaddleActive('right', false);
      }
    });
    
    // Collision detection with bumpers
    function handleBumperCollisions() {
      const ballPos = ball.mesh.position;
      bumpers.forEach(b => {
        const dist = ballPos.distanceTo(b.position);
        if (dist < (ball.radius + b.radius)) {
          // collision response
          const normal = ballPos.clone().sub(b.position).normalize();
          // push ball out
          ball.mesh.position.copy(b.position.clone().add(normal.clone().multiplyScalar(ball.radius + b.radius + 0.02)));
          // reflect velocity
          const velNormal = ball.velocity.dot(normal);
          if (velNormal < 0) {
            ball.velocity.addScaledVector(normal, -2 * velNormal);
            // add extra kick
            ball.velocity.add(normal.clone().multiplyScalar(0.12));
            // clamp speed
            if (ball.velocity.length() > 0.32) ball.velocity.normalize().multiplyScalar(0.32);
            playBumperSound();
            updateScore(15);
            // visual flash
            b.mesh.children[0].material.emissive.set(0xffffff);
            setTimeout(() => {
              b.mesh.children[0].material.emissive.set(new THREE.Color(b.color).multiplyScalar(0.7));
            }, 100);
          }
        }
      });
    }
    
    // Paddle collision
    function handlePaddleCollision(paddleObj) {
      const paddleGroup = paddleObj.group;
      const paddlePos = paddleGroup.position;
      const paddleWidth = 1.4;
      const paddleHeight = 0.25;
      const paddleDepth = 0.5;
      
      const ballPos = ball.mesh.position;
      
      // Simple AABB check (approximate because paddle rotates)
      const dx = Math.abs(ballPos.x - paddlePos.x);
      const dy = Math.abs(ballPos.y - paddlePos.y);
      const dz = Math.abs(ballPos.z - paddlePos.z);
      
      if (dx < paddleWidth/2 + ball.radius && 
          dy < paddleHeight/2 + ball.radius && 
          dz < paddleDepth/2 + ball.radius) {
        // collision response: push upward and sideways
        const dirX = (ballPos.x - paddlePos.x) * 1.2;
        ball.velocity.x = dirX * 0.9 + (Math.random() - 0.5) * 0.15;
        ball.velocity.y = Math.abs(ball.velocity.y) * 1.3 + 0.18;
        ball.velocity.z = (Math.random() - 0.5) * 0.22;
        
        // ensure minimum upward
        if (ball.velocity.y < 0.15) ball.velocity.y = 0.18;
        if (ball.velocity.length() > 0.32) ball.velocity.normalize().multiplyScalar(0.32);
        
        // push ball out of paddle
        ball.mesh.position.y = paddlePos.y + paddleHeight/2 + ball.radius + 0.05;
        
        playPaddleSound();
        updateScore(5);
      }
    }
    
    // Update paddles rotation
    function updatePaddles(deltaTime) {
      const lerpFactor = 0.2;
      // left paddle
      if (leftPaddle.active) leftPaddle.targetAngle = 0.7;
      else leftPaddle.targetAngle = 0;
      leftPaddle.angle += (leftPaddle.targetAngle - leftPaddle.angle) * lerpFactor;
      leftPaddle.group.rotation.z = leftPaddle.angle;
      
      // right paddle
      if (rightPaddle.active) rightPaddle.targetAngle = -0.7;
      else rightPaddle.targetAngle = 0;
      rightPaddle.angle += (rightPaddle.targetAngle - rightPaddle.angle) * lerpFactor;
      rightPaddle.group.rotation.z = rightPaddle.angle;
    }
    
    // Animate ball aura
    let time = 0;
    
    // Main loop
    function animate() {
      requestAnimationFrame(animate);
      
      const deltaTime = 0.016; // approximate
      time += deltaTime;
      
      // Update paddles
      updatePaddles(deltaTime);
      
      // Move ball
      ball.mesh.position.x += ball.velocity.x;
      ball.mesh.position.y += ball.velocity.y;
      ball.mesh.position.z += ball.velocity.z;
      
      // Boundary collisions (walls)
      const pos = ball.mesh.position;
      // left/right
      if (pos.x - ball.radius < bounds.left) {
        ball.mesh.position.x = bounds.left + ball.radius;
        ball.velocity.x *= -0.9;
        playBounceSound(360, 'square', 0.08);
      }
      if (pos.x + ball.radius > bounds.right) {
        ball.mesh.position.x = bounds.right - ball.radius;
        ball.velocity.x *= -0.9;
        playBounceSound(360, 'square', 0.08);
      }
      // top
      if (pos.y + ball.radius > bounds.top) {
        ball.mesh.position.y = bounds.top - ball.radius;
        ball.velocity.y *= -0.85;
        playBounceSound(520, 'triangle', 0.1);
        updateScore(8);
      }
      // bottom (check if fallen)
      if (pos.y - ball.radius < bounds.bottom) {
        resetBall();
        playBounceSound(200, 'sawtooth', 0.2);
      }
      // z bounds
      if (pos.z + ball.radius > bounds.zFront) {
        ball.mesh.position.z = bounds.zFront - ball.radius;
        ball.velocity.z *= -0.85;
      }
      if (pos.z - ball.radius < bounds.zBack) {
        ball.mesh.position.z = bounds.zBack + ball.radius;
        ball.velocity.z *= -0.85;
      }
      
      // Collisions
      handleBumperCollisions();
      handlePaddleCollision(leftPaddle);
      handlePaddleCollision(rightPaddle);
      
      // Rotate ball aura
      ballGroup.children[1].rotation.x += 0.04;
      ballGroup.children[1].rotation.y += 0.03;
      ballGroup.children[2].rotation.z += 0.05;
      ballGroup.children[2].rotation.x += 0.04;
      
      // Update karaoke text
      state.phraseTimer += deltaTime;
      if (state.phraseTimer > 3.5) {
        state.phraseTimer = 0;
        state.currentPhrase = (state.currentPhrase + 1) % state.karaokePhrases.length;
      }
      document.getElementById('karaokeLine').textContent = state.karaokePhrases[state.currentPhrase];
      
      // Psychedelic lighting changes
      colorLights[0].color.setHSL(Math.sin(time*0.7)*0.2+0.7, 1, 0.6);
      colorLights[1].color.setHSL(Math.sin(time*0.9+2)*0.2+0.55, 1, 0.6);
      
      // Render
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    
    animate();
    
    // Handle resize
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Initial audio context on first user interaction (already handled by buttons)
    console.log('🌀 DREAMBALLZ PSYCHEDELIC PINBALL KARAOKE READY • Use arrows/A/D or buttons!');
  </script>
</body>
